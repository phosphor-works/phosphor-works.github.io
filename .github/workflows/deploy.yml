#
# Build the Phosphor umbrella site (Astro) + Doxygen API reference and
# deploy it to https://phosphor-works.org/.  Based on the official Astro
# template with three additions:
#
#   1. Check out the upstream repositories the site is built from, side
#      by side under _src/: phosphor-libs and phosphor-shell-libs (the
#      headers doxygen scans), PlasmaZones (gallery data, changelog,
#      D-Bus XML), phosphor-surface-packs (the surface gallery) and
#      Afterglow (its docs).  Branding is not checked out: the site
#      pins a branding release, as the apps do (scripts/fetch-branding.mjs).
#   2. Run scripts/build-docs.sh before astro build, and fold its
#      output into dist/api/ before the site is packaged.
#   3. Refresh the PlasmaZones gallery data and changelog before the
#      build.  Nothing is committed back, so the copies in this repo
#      are only what a local build starts from.
#
# The workflow also runs every night, so a change upstream is live
# within a day without anyone pushing here.
#
# The site is served from the project's own server at
# https://phosphor-works.org/ (see the deploy job).

name: Deploy site

on:
  push:
    branches: [main]
  # Nightly, 09:17 UTC (03:17 US Central).  Off the hour on purpose:
  # GitHub delays or drops scheduled runs queued at :00.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys — a slow doxygen run shouldn't let a newer commit
# overtake it and then be overwritten by the older build.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # The sync and docs scripts find each upstream checkout under this
      # directory by its repository name, as they find the siblings of a
      # local clone.
      PHOSPHOR_WORKS_SRC: ${{ github.workspace }}/_src
    steps:
      - name: Checkout phosphor-works.github.io
        uses: actions/checkout@v6

      # Every upstream at the tip of main, so the site never waits on a
      # pin bump here.  The commit of each is printed so a nightly build
      # can be traced back to the sources it was built from.
      - name: Check out the upstream sources
        run: |
          set -euo pipefail
          for repo in PlasmaZones phosphor-libs phosphor-shell-libs phosphor-surface-packs Afterglow; do
            git clone --quiet --depth 1 --branch main \
              "https://github.com/phosphor-works/$repo.git" "$PHOSPHOR_WORKS_SRC/$repo"
            echo "$repo $(git -C "$PHOSPHOR_WORKS_SRC/$repo" rev-parse HEAD)"
          done

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install doxygen + graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Install npm dependencies
        run: npm ci

      # The sync below runs every bundled tiling algorithm through the
      # `luau` CLI to draw its gallery preview.  Build that CLI from
      # the Luau source phosphor-libs pins, so the previews come from
      # the runtime the libraries embed.  It only changes when the pin
      # does, so it is cached on the pinned archive's SHA-256.
      - name: Read the Luau pin
        id: luau-pin
        run: |
          set -euo pipefail
          deps="$PHOSPHOR_WORKS_SRC/phosphor-libs/cmake/PhosphorDependencies.cmake"
          sha=$(sed -n 's/^set(PHOSPHOR_DEP_luau_SHA256 "\([0-9a-f]\{64\}\)")$/\1/p' "$deps")
          if [ -z "$sha" ]; then
            echo "::error::no PHOSPHOR_DEP_luau_SHA256 pin found in phosphor-libs cmake/PhosphorDependencies.cmake"
            exit 1
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore luau
        id: luau-cache
        uses: actions/cache@v5
        with:
          path: _luau/bin/luau
          key: luau-cli-${{ runner.os }}-${{ steps.luau-pin.outputs.sha256 }}

      - name: Build luau from the pinned Luau
        if: steps.luau-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The fetch script downloads every pinned archive and checks
          # its hash.
          deps="$PHOSPHOR_WORKS_SRC/phosphor-libs/cmake/PhosphorDependencies.cmake"
          cmake -DPHOSPHOR_DEPS_FETCH="$PWD/_luau/deps" -P "$deps"
          luau_file=$(sed -n 's/^set(PHOSPHOR_DEP_luau_FILE "\(.*\)")$/\1/p' "$deps")
          mkdir -p _luau/src _luau/bin
          tar xzf "_luau/deps/$luau_file" -C _luau/src --strip-components=1
          cmake -S _luau/src -B _luau/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_CLI=ON \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_WEB=OFF
          cmake --build _luau/build --target Luau.Repl.CLI --parallel "$(nproc)"
          cp _luau/build/luau _luau/bin/luau

      # Regenerate src/data/plasmazones/ (layouts, shaders, scrolling
      # templates, algorithms, changelog) from the PlasmaZones,
      # phosphor-surface-packs and phosphor-libs checkouts, and scaffold
      # a news entry for a feature release that has none yet.
      # settings.json is the one file left as committed: its dump tool
      # needs a full PlasmaZones build, so the script skips it.
      # The pinned branding release (SVGs and palette) into vendor/.
      - name: Fetch branding
        run: npm run fetch:branding

      - name: Sync PlasmaZones data
        env:
          LUAU: ${{ github.workspace }}/_luau/bin/luau
        run: |
          set -euo pipefail
          npm run sync:plasmazones
          git status --short src/data/plasmazones src/content/news

      - name: Build Doxygen API reference
        run: ./scripts/build-docs.sh --clean

      - name: Build Astro site
        run: npx astro build

      # Fold the doxygen output into the Astro build output so the
      # server serves everything from one tree.  Branding SVGs come through
      # automatically via the public/brand/assets → vendor/branding/svg
      # symlink (Astro's public/ passthrough follows it).
      - name: Merge API docs into dist/
        run: |
          mkdir -p dist/api/html
          cp -r api/html/. dist/api/html/

      # Scan the fully-merged dist/ (Astro pages + Doxygen tree) for
      # dead internal links.  Runs here rather than inside astro build
      # because /api/html/* doesn't exist until the merge step above.
      # Fails the deploy on broken refs so /plasmazones/shortcut typos
      # and stale /libraries/<slug>/ renames don't reach the site.
      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir (not --base-url) is the right flag for resolving
          # root-relative links like /api/html/ against a local dist/.
          # It also needs an absolute path on lychee >= 0.23, so we
          # expand github.workspace rather than passing "./dist".
          args: --no-progress --offline --root-dir ${{ github.workspace }}/dist ${{ github.workspace }}/dist
          # Don't block deploys on broken links — log to the job summary
          # and move on.  A handful of /api/html/ namespace pages are
          # expected-missing because PlasmaZones v3 reorganized the
          # source tree faster than docs/mainpage.md's @ref entries
          # caught up.  Treat the check as a visible advisory until the
          # upstream Doxygen inputs stabilize.
          fail: false

      # One tarball of the merged tree, links resolved: the server
      # rejects archives that contain symlinks.
      - name: Package the site
        run: tar --dereference --hard-dereference -C dist -czf site.tar.gz .

      - name: Upload the site artifact
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: site.tar.gz
          retention-days: 7
          compression-level: 0

  # Publish the same build to the project's own server.  The job uploads
  # one tarball over SFTP to an upload-only, chrooted account; the server
  # validates it and switches the live site to it within a minute (and
  # keeps the previous releases for rollback).  Everything it needs lives
  # in the `vps` environment, which only the main branch may deploy to.
  # The key, the server address and its pinned host key are secrets: the
  # address is in no DNS record, and secrets are masked in public logs.
  deploy:
    name: Deploy to phosphor-works.org
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: vps
      url: https://phosphor-works.org/
    steps:
      - name: Download the site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: artifact

      - name: Upload to the server
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          PORT: ${{ vars.VPS_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          ( umask 077
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts )
          name="site-${GITHUB_SHA}.tar.gz"
          sftp -b - -i ~/.ssh/deploy_key -P "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$HOST" <<EOF
          put artifact/site.tar.gz $name.part
          rename $name.part $name
          EOF
          rm -f ~/.ssh/deploy_key
          echo "Uploaded $name; the server publishes it within a minute." >> "$GITHUB_STEP_SUMMARY"

  # GitHub switches off scheduled workflows in a public repo after 60
  # days without repository activity, and the nightly run makes no
  # commits.  Re-enabling the workflow through the API resets that
  # clock, so the schedule keeps itself alive.
  keepalive:
    name: Keep the schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"
