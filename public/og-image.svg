<!--
    Open Graph card.  Rendered at 1200x630 (the canonical OG size) on
    share-link previews across Mastodon, LinkedIn, Discord, Slack, etc.
    Left: the Phosphor Φ mark scaled up.  Right: wordmark + tagline
    on the brand gradient, with a thin accent bar underlining.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <radialGradient id="og-bg-scene" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
            gradientTransform="translate(300 200) rotate(20) scale(900)">
            <stop offset="0"    stop-color="#0B1730"/>
            <stop offset="0.65" stop-color="#070F22"/>
            <stop offset="1"    stop-color="#050916"/>
        </radialGradient>
        <linearGradient id="og-phi" x1="300" y1="240" x2="724" y2="784" gradientUnits="userSpaceOnUse">
            <stop offset="0"    stop-color="#22D3EE"/>
            <stop offset="0.55" stop-color="#A855F7"/>
            <stop offset="1"    stop-color="#F43F5E"/>
        </linearGradient>
        <linearGradient id="og-wordmark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#22D3EE"/>
            <stop offset="0.35" stop-color="#3B82F6"/>
            <stop offset="0.70" stop-color="#A855F7"/>
            <stop offset="1"    stop-color="#F43F5E"/>
        </linearGradient>
        <linearGradient id="og-accent-bar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#22D3EE"/>
            <stop offset="0.45" stop-color="#3B82F6"/>
            <stop offset="0.75" stop-color="#A855F7"/>
            <stop offset="1"    stop-color="#F43F5E"/>
        </linearGradient>
    </defs>

    <!-- Scene background -->
    <rect width="1200" height="630" fill="url(#og-bg-scene)"/>
    <!-- Subtle ambient accents -->
    <circle cx="180" cy="140" r="320" fill="#22D3EE" opacity="0.06"/>
    <circle cx="1050" cy="520" r="360" fill="#A855F7" opacity="0.07"/>
    <circle cx="900" cy="120" r="240" fill="#F43F5E" opacity="0.04"/>

    <!-- Left: Phosphor Φ mark, badge-free (glyph center 512,512 lands
         at ~272,347 to match the old badge's visual position) -->
    <g transform="translate(42 117) scale(0.45)">
        <g fill="url(#og-phi)">
            <path d="M583 358L598 362L612 367L626 374L639 381L652 389L664 398L676 408L686 419L695 431L703 444L709 458L714 472L716 487L714 502L702 516L702 516L689 504L685 492L681 480L678 469L674 457L669 446L664 434L658 423L650 412L641 401L632 391L621 382L609 373L597 365L583 358Z"/>
            <path d="M696 553L706 571L704 588L698 603L690 618L680 631L668 643L654 653L640 661L624 669L608 674L592 678L575 681L559 682L541 676L541 676L555 665L569 658L582 651L594 643L605 635L616 626L626 617L635 607L643 598L652 589L660 579L668 570L678 560L696 553Z"/>
            <path d="M483 676L465 682L449 681L432 678L416 674L400 669L384 661L370 653L356 643L344 631L334 618L326 603L320 588L318 571L328 553L328 553L346 560L356 570L364 579L372 589L381 598L389 607L398 617L408 626L419 635L430 643L442 651L455 658L469 665L483 676Z"/>
            <path d="M322 516L310 502L308 487L310 472L315 458L321 444L329 431L338 419L348 408L360 398L372 389L385 381L398 374L412 367L426 362L441 358L441 358L427 365L415 373L403 382L392 391L383 401L374 412L366 423L360 434L355 446L350 457L346 469L343 480L339 492L335 504L322 516Z"/>
            <path d="M512 206 C540 372 540 652 512 818 C484 652 484 372 512 206 Z"/>
        </g>
    </g>

    <!-- Right: wordmark + tagline + byline -->
    <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
        <text x="480" y="290" font-size="120" font-weight="700" letter-spacing="-3" fill="url(#og-wordmark)">
            Phosphor
        </text>
        <text x="484" y="355" font-size="30" font-weight="500" fill="#E6EDFF" opacity="0.88">
            Qt6 and Wayland libraries for
        </text>
        <text x="484" y="396" font-size="30" font-weight="500" fill="#E6EDFF" opacity="0.88">
            window-management tools.
        </text>
        <rect x="484" y="436" width="240" height="4" rx="2" fill="url(#og-accent-bar)"/>
        <text x="484" y="490" font-family="JetBrains Mono, ui-monospace, monospace"
              font-size="20" font-weight="500" fill="#94A3B8">
            phosphor-works.github.io
        </text>
    </g>
</svg>
